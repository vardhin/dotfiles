# mpd: the music library (~/Music), run as a user service (mpd.service).
# rmpc is its client; mpd-mpris (mpd-mpris.service) puts it on MPRIS, where
# Dot Shell's strip, MEDIA pane and media panels pick it up.

music_directory     "~/Music"
playlist_directory  "~/.local/state/mpd/playlists"
db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

bind_to_address     "localhost"
bind_to_address     "~/.local/state/mpd/socket"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
follow_outside_symlinks "yes"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}

