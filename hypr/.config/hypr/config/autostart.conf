# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Session environment for D-Bus activated apps and portals (slow app launch fix).
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment

# Boot sound at mpv's own volume; the sink volume is never touched.
exec-once = mpv --no-video --really-quiet --volume=60 ~/.config/hypr/sounds/boot.wav

# Dot Shell (Quickshell) is the whole shell: strip, wallpaper, notifications,
# OSD, launcher, panes, lock + idle (replaces hyprlock/hypridle), polkit agent,
# night warmth. See ~/.config/quickshell/dotshell/shell.qml.
exec-once = $dotshell

# Keep clipboard contents after the source app closes.
exec-once = wl-clip-persist --clipboard regular
