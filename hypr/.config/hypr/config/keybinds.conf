# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                         Keybinds                            ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Every bind is a `bindd` (flags + d): the third field is the description the
# Dot Shell cheatsheet (Super /) shows. Descriptions cannot contain commas.
# Binds that share a description and differ only by a digit (workspaces 1..0)
# collapse into one cheatsheet line.

### ====== APPS ======
bindd = Ctrl Alt, T, Terminal, exec, $TERMINAL
bindd = $mainMod, E, Browser, exec, $BROWSER
bindd = $mainMod, C, Editor, exec, $EDITOR

### ====== DOT SHELL ======
bindd = Alt, space, App launcher, exec, $dotshell ipc call pane toggle launcher
bindd = $mainMod, X, Dropdown terminal, exec, $dotshell ipc call dropdown toggle
bindd = $mainMod, N, Messages, exec, $dotshell ipc call pane toggle notifs
bindd = $mainMod Shift, N, Do not disturb, exec, $dotshell ipc call notifs dnd
bindd = $mainMod, slash, Shortcuts cheatsheet, exec, $dotshell ipc call pane toggle cheatsheet
bindd = $mainMod Shift, C, Caffeine (stay awake), exec, $dotshell ipc call caffeine toggle
bindd = $mainMod, D, Toggle the LED strip, exec, $dotshell ipc call strip toggle
bindd = $mainMod Shift, D, Next era, exec, $dotshell ipc call tokens cycleEra
bindd = $mainMod, T, Era and display settings, exec, $dotshell ipc call pane toggle eras
bindd = $mainMod Ctrl, D, Restart Dot Shell, exec, $dotshell kill; $dotshell

### ====== LOCK ======
# Through logind, so the lock path is the same as idle and suspend.
bindd = $mainMod, L, Lock screen, exec, loginctl lock-session

### ====== SCREEN CAPTURE ======
bindd = , Print, Screenshot full screen, exec, $scriptPath/screenshot.sh fullscreen
bindd = $mainMod, Print, Screenshot area, exec, $scriptPath/screenshot.sh area
bindd = $mainMod Shift, Print, Screenshot menu, exec, $scriptPath/screenshot.sh interactive
bindd = $mainMod Ctrl, Print, Screenshot area and edit, exec, $scriptPath/screenshot.sh edit-area
bindd = $mainMod, P, Screenshot area, exec, $scriptPath/screenshot.sh area
bindd = $mainMod Shift, P, Screenshot menu, exec, $scriptPath/screenshot.sh interactive

### ====== NIGHT WARMTH ======
bindd = $mainMod Shift, H, Night warmth, exec, $dotshell ipc call night toggle

### ====== WORKSPACES ======
bindd = $mainMod, 1, Go to workspace, workspace, 1
bindd = $mainMod, 2, Go to workspace, workspace, 2
bindd = $mainMod, 3, Go to workspace, workspace, 3
bindd = $mainMod, 4, Go to workspace, workspace, 4
bindd = $mainMod, 5, Go to workspace, workspace, 5
bindd = $mainMod, 6, Go to workspace, workspace, 6
bindd = $mainMod, 7, Go to workspace, workspace, 7
bindd = $mainMod, 8, Go to workspace, workspace, 8
bindd = $mainMod, 9, Go to workspace, workspace, 9
bindd = $mainMod, 0, Go to workspace, workspace, 10
bindd = $mainMod Shift, E, Empty workspace, workspace, empty
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1
bindd = Alt, Tab, Last workspace, workspace, previous

### ====== MOVE WINDOW TO WORKSPACE ======
bindd = $mainMod Shift, 1, Move window to workspace, movetoworkspace, 1
bindd = $mainMod Shift, 2, Move window to workspace, movetoworkspace, 2
bindd = $mainMod Shift, 3, Move window to workspace, movetoworkspace, 3
bindd = $mainMod Shift, 4, Move window to workspace, movetoworkspace, 4
bindd = $mainMod Shift, 5, Move window to workspace, movetoworkspace, 5
bindd = $mainMod Shift, 6, Move window to workspace, movetoworkspace, 6
bindd = $mainMod Shift, 7, Move window to workspace, movetoworkspace, 7
bindd = $mainMod Shift, 8, Move window to workspace, movetoworkspace, 8
bindd = $mainMod Shift, 9, Move window to workspace, movetoworkspace, 9
bindd = $mainMod Shift, 0, Move window to workspace, movetoworkspace, 10
bindd = $mainMod Alt, 1, Send window to workspace, movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, Send window to workspace, movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, Send window to workspace, movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, Send window to workspace, movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, Send window to workspace, movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, Send window to workspace, movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, Send window to workspace, movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, Send window to workspace, movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, Send window to workspace, movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, Send window to workspace, movetoworkspacesilent, 10

### ====== WINDOWS ======
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d
bindmd = $mainMod, mouse:272, Move window (drag), movewindow
bindmd = $mainMod, mouse:273, Resize window (drag), resizewindow
bindd = $mainMod, Q, Close window, killactive
bindd = Alt, Return, Fullscreen, fullscreen
bindd = $mainMod, J, Toggle split, layoutmsg, togglesplit
bindd = $mainMod, K, Toggle group, togglegroup
bindd = $mainMod Shift, F, Toggle floating, togglefloating

### ====== POWER ======
bindd = $mainMod, Backspace, Session menu, exec, $dotshell ipc call pane toggle session
bindd = , XF86PowerOff, Suspend (locks first), exec, systemctl suspend
bindd = $mainMod, XF86PowerOff, Power off, exec, pkill -SIGINT electron; systemctl poweroff
bindd = $mainMod Shift, XF86PowerOff, Reboot, exec, pkill -SIGINT electron; systemctl reboot

### ====== VOLUME & BRIGHTNESS ======
# The Dot Shell OSD reacts to the change itself; nothing to call here.
bindeld = , XF86AudioRaiseVolume, Volume up, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindeld = , XF86AudioLowerVolume, Volume down, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindld = , XF86AudioMute, Mute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-

### ====== MEDIA ======
bindld = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

### ====== ZOOM (CURSOR) ======
bindd = $mainMod, Z, Toggle zoom, exec, bash -c 'zoom=$(hyprctl -j getoption cursor:zoom_factor | jq -r ".float"); if [ "$zoom" = "1.000000" ]; then hyprctl keyword cursor:zoom_factor 1.5; else hyprctl keyword cursor:zoom_factor 1; fi'
bindde = $mainMod, equal, Zoom in, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bindde = $mainMod, minus, Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
bindde = $mainMod, KP_ADD, Zoom in, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bindde = $mainMod, KP_SUBTRACT, Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

### ====== LEXICON SHELL OVERLAY ======
bindd = $mainMod, grave, Lexicon overlay, exec, pkill -x lexicon-frontend && hyprctl dispatch focuswindow "prev" || ~/Documents/git/lexicon/lexicon-frontend/src-tauri/target/release/lexicon-frontend

### ====== HYPRLAND SETTINGS BLOCK ======
binds {
  allow_workspace_cycles = 1
  workspace_back_and_forth = 1
  workspace_center_on = 1
  movefocus_cycles_fullscreen = true
  window_direction_monitor_fallback = true
}
