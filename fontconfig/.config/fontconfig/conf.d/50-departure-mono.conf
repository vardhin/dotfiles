<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Departure Mono is a pixel font: draw it with hard pixels only. Without this,
     Dot Shell glyphs get half-lit, color-fringed edge dots (subpixel AA). -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>DepartureMono</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
