# Where a finished download goes (see dotd/src/sort.rs). First match wins;
# anything unmatched stays in ~/Downloads. Matched on mime type (globs),
# extension, or the site it came from (domain, once the browser extension
# sends it). A clash gets a numeric suffix; `dotd undo` puts a file back.

[[sort]]
to   = "~/Documents/Downloads"
mime = ["application/pdf", "application/msword", "application/vnd.oasis.opendocument.*",
        "application/vnd.openxmlformats-officedocument.*", "application/vnd.ms-*",
        "application/epub+zip", "application/rtf", "text/*"]
ext  = ["pdf", "doc", "docx", "odt", "ods", "odp", "xls", "xlsx", "ppt", "pptx",
        "txt", "md", "csv", "epub", "rtf", "tex"]

[[sort]]
to   = "~/Pictures/Downloads"
mime = ["image/*"]
ext  = ["heic", "webp", "avif", "svg"]

[[sort]]
to   = "~/Videos"
mime = ["video/*"]
ext  = ["mkv", "webm", "mp4", "mov"]

[[sort]]
to   = "~/Music"
mime = ["audio/*"]
ext  = ["flac", "mp3", "ogg", "opus", "m4a", "wav"]

# Archives and installers
[[sort]]
to   = "~/Archives"
mime = ["application/zip", "application/x-tar", "application/gzip", "application/x-7z-compressed",
        "application/vnd.rar", "application/x-rar-compressed", "application/x-xz",
        "application/zstd", "application/x-iso9660-image", "application/x-msdownload",
        "application/vnd.debian.binary-package", "application/x-rpm"]
ext  = ["zip", "tar", "tar.gz", "tar.xz", "tar.zst", "tar.bz2", "pkg.tar.zst", "gz", "xz",
        "zst", "7z", "rar", "iso", "img", "deb", "rpm", "appimage", "exe", "msi", "dmg", "run"]
