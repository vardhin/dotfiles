[package]
name = "dotd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
inotify = { version = "0.11.5", features = ["stream"] }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
toml = "1.1.8"
