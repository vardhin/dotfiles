# Hyprland for the greeter only: no binds, no animations, one job.
# Installed to /etc/greetd/hyprland.conf by system/install.sh.
# Dot Shell's greeter (/usr/local/share/dotshell/greeter.qml) logs in through
# greetd; when it quits, Hyprland exits and greetd starts the session.

monitor = , preferred, auto, 1

# Where Dot Shell's Export leaves the era, wallpaper and user name.
env = XDG_STATE_HOME,/var/lib/dotshell-greeter
env = QT_QPA_PLATFORM,wayland
# The greeter user's home is /, so caches go to /tmp.
env = XDG_CACHE_HOME,/tmp/dotshell-greeter

exec-once = qs -p /usr/local/share/dotshell/greeter.qml; hyprctl dispatch exit

input {
    kb_options = fkeys:basic_13-24
}

animations {
    enabled = false
}

decoration {
    shadow:enabled = false
    blur:enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

cursor {
    inactive_timeout = 3
}
