# mpv: plays every video and stream on the desktop, Dot TV included (dottv).
# mpv-mpris (/etc/mpv/scripts/mpris.so) puts each player on MPRIS, where Dot
# Shell's strip, MEDIA pane and media panels pick it up.

hwdec = auto-safe
vo = gpu-next
keep-open = no
# YouTube and other streams through yt-dlp: up to 1080p.
ytdl-format = bestvideo[height<=?1080]+bestaudio/best

# OSD and subtitles in the shell's pixel font, era-neutral grey on glass.
osd-font = "DepartureMono Nerd Font"
osd-font-size = 33
osd-bar-h = 2
osd-border-size = 1
osd-color = "#E0E0E0"
osd-border-color = "#000000"
sub-font = "DepartureMono Nerd Font"
sub-border-size = 2

# Album art is not a video; audio files play without a window.
audio-display = no
